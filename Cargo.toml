[package]
name = "dfhash"
version = "0.1.5"
edition = "2024"
description = "A deterministic content hasher for tabular data files"

[dependencies]
anyhow = "1.0"
clap = { version = "4.4", features = ["derive"] }
flate2 = "1.0"
polars-core = {
  version = "0.55",
  default-features = false,
  features = [
    "dtype-struct",
    "nightly",
    "performant",
    "simd",
  ]
}
polars-io = {
  version = "0.55",
  default-features = false,
  features = [
    "decompress",
  ]
}
polars-lazy = {
  version = "0.55",
  default-features = false,
  features = [
    "csv",
    "parquet",
    "streaming",
  ]
}
polars-plan = { version = "0.55", default-features = false, features = ["cse"] }
polars-utils = { version = "0.55", default-features = false }
zstd = "0.13"

hex = "0.4"
mimalloc = { version = "0.1", default-features = false }
sha2 = "0.11"

colored = "3.0"
similar = "3.0"

[dev-dependencies]
regex = "1.10"
rstest = "0.26"
tempfile = "3.10"

[target."cfg(unix)".dependencies]
pager2 = "0.6"

[profile.release]
debug = false
lto = "fat"
codegen-units = 1

[package]
name = "dfhash"
version = "0.1.5"
edition = "2024"
description = "A deterministic content hasher for tabular data files"

[dependencies]
anyhow = "1.0"
clap = { version = "4.4", features = ["derive"] }
polars-core = { version = "0.55", default-features = false, features = [
  "dtype-struct",
  "nightly",
  "performant",
  "simd",
] }
polars-io = { version = "0.55", default-features = false, features = [
  "decompress",
] }
polars-lazy = { version = "0.55", default-features = false, features = [
  "csv",
  "parquet",
  "streaming",
] }
polars-plan = { version = "0.55", default-features = false, features = ["cse"] }
polars-utils = { version = "0.55", default-features = false }
flate2 = "1.0"
zstd = "0.13"

sha2 = "0.11"
hex = "0.4"
mimalloc = { version = "0.1", default-features = false }

similar = "3.0"
colored = "3.0"

[target.'cfg(unix)'.dependencies]
pager2 = "0.6"

[dev-dependencies]
rstest = "0.26"
tempfile = "3.10"
regex = "1.10"

[profile.release]
codegen-units = 1
debug = false
lto = "fat"
